<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">WireDiet — Cut the chatter. Keep the features.</title>
  <desc id="desc">GitHub social card for WireDiet with Observe Test Verify workflow.</desc>
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1720"/><stop offset="1" stop-color="#122A36"/></linearGradient></defs>
  <rect width="1280" height="640" fill="url(#g)"/>
  <circle cx="1125" cy="100" r="220" fill="#1D5368" opacity=".18"/><circle cx="1180" cy="620" r="300" fill="#1E6B53" opacity=".12"/>
  <g transform="translate(86 86)">
    <rect width="132" height="132" rx="29" fill="#0E202B" stroke="#2C4654" stroke-width="2"/>
    <path d="M15 35 C36 35 40 50 60 50" fill="none" stroke="#8296A2" stroke-width="10" stroke-linecap="round"/>
    <path d="M15 66 C36 66 40 66 60 66" fill="none" stroke="#2B8BDC" stroke-width="10" stroke-linecap="round"/>
    <path d="M15 97 C36 97 40 82 60 82" fill="none" stroke="#D79A3B" stroke-width="10" stroke-linecap="round"/>
    <path d="M68 25 V107" fill="none" stroke="#D8E3E9" stroke-width="10" stroke-linecap="round"/>
    <path d="M78 66 H106" fill="none" stroke="#65D58B" stroke-width="10" stroke-linecap="round"/>
    <path d="M98 52 L113 66 L98 80" fill="none" stroke="#65D58B" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="252" y="151" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="74" font-weight="800" fill="#F2F7F8">WireDiet</text>
  <text x="88" y="300" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="57" font-weight="760" fill="#F2F7F8">Cut the chatter.</text>
  <text x="88" y="367" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="57" font-weight="760" fill="#F2F7F8">Keep the features.</text>
  <g transform="translate(90 468)" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="27" font-weight="800">
    <text x="0" y="0" fill="#66B5F3">OBSERVE</text><text x="170" y="0" fill="#8296A2">→</text><text x="220" y="0" fill="#E2B05B">TEST</text><text x="350" y="0" fill="#8296A2">→</text><text x="400" y="0" fill="#65D58B">VERIFY</text>
  </g>
  <text x="90" y="548" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="22" fill="#9EB0BA">Minimal, device-specific DNS policies through real experiments.</text>
